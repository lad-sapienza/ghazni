name: Check blog for updates

# The blog (unlike the rest of this site) is edited directly in BraDypUS,
# not via a git push — so nothing normally triggers deploy.yml when a post
# is published or edited there. This runs nightly instead, and only
# actually triggers a rebuild when something changed, so a quiet night
# costs nothing beyond one small read from BraDypUS. workflow_dispatch is
# there for testing it, or for triggering a check on demand instead of
# waiting for the schedule — the same result as pushing to main, without
# needing a commit.
#
# Change detection is the latest `updated_at` among published posts (see
# scripts/check-blog-freshness.mjs) — catches an edit to an already-
# published post, not just a newly published/unpublished one.

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC every night — adjust as you like
  workflow_dispatch:

permissions:
  contents: read
  actions: write # to trigger deploy.yml via `gh workflow run`

concurrency:
  group: check-blog-updates
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keyed on the run id (always a cache miss) with a prefix restore-key,
      # same trick as deploy.yml's BraDypUS image cache — picks up the most
      # recent previous run's value and always saves a fresh one.
      - name: Restore last-seen freshness marker
        uses: actions/cache/restore@v4
        with:
          path: .blog-check-state
          key: blog-check-state-${{ github.run_id }}
          restore-keys: |
            blog-check-state-

      - name: Compare against BraDypUS's latest post update
        id: check
        env:
          BDUS_API_KEY: ${{ secrets.BDUS_API_KEY }}
        run: |
          mkdir -p .blog-check-state
          previous=$(cat .blog-check-state/latest 2>/dev/null || echo "")
          current=$(node scripts/check-blog-freshness.mjs)
          echo "Previous: '$previous' — current: '$current'"
          echo "$current" > .blog-check-state/latest
          echo "changed=$([ "$previous" != "$current" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Save current marker for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .blog-check-state
          key: blog-check-state-${{ github.run_id }}

      - name: Trigger a rebuild
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }}
