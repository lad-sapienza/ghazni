name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A fresh checkout has none of the ~11k BraDypUS images from previous
      # runs, so without this every build re-downloads all of them (~10+
      # minutes). Keyed on the run id so it always misses on restore-keys'
      # exact match and saves a new cache at the end of the job; restore-keys
      # then picks up the most recent previous one to warm the download.
      - name: Restore BraDypUS image cache
        uses: actions/cache@v4
        with:
          path: public/images/bdus
          key: bdus-images-${{ github.run_id }}
          restore-keys: |
            bdus-images-

      - name: Build
        run: npm run build
        env:
          BDUS_API_KEY: ${{ secrets.BDUS_API_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
